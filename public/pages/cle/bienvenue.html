    <!-- Après une clé acceptée (cle.js, validerCle). -->
    <dialog id="bienvenue-cle"
            class="reglages pico"
            aria-labelledby="titre-bienvenue-cle"
            aria-describedby="texte-bienvenue-cle">
        <form method="dialog">
            <h2 id="titre-bienvenue-cle" data-t="cle.titre"></h2>
            <p id="texte-bienvenue-cle" data-t="cle.bienvenue"></p>
            <div class="boutons-dialogue">
                <button type="submit" class="bouton-principal" autofocus data-t="dialogue.fermer"></button>
            </div>
        </form>
    </dialog>
