    <header class="entete">
        <button type="button"
                class="bouton-icone burger"
                id="ouvrir-menu"
                data-t-attr="aria-label:menu.ouvrir"
                aria-haspopup="dialog"
                aria-controls="menu"
                aria-expanded="false">
            <svg class="icone-burger" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <svg class="icone-volet" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="titre">
            <!-- Le nom de l'outil actif suit la marque : afficherOutil le remplit. -->
            <h1 class="marque">Albert&nbsp;Go<span class="outil-actif" id="outil-actif"></span></h1>
        </div>
    </header>

    <!-- Traduire : langues dans une carte fixe sous l'en-tête. -->
    <div id="langues" class="barre-langues" hidden>
        <div class="langues pico">
            <select id="langue-source" data-t-attr="aria-label:langue.source"></select>
            <svg class="fleche-langues" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <select id="langue-cible" data-t-attr="aria-label:langue.cible"></select>
        </div>
    </div>

    <!-- Menu latéral, comme albert-droid. -->
    <dialog id="menu" class="volet" aria-labelledby="titre-menu">
        <div class="volet-contenu">
            <div class="volet-titre">
                <h2 id="titre-menu" class="marque">Albert&nbsp;Go</h2>
                <!-- Même motif que le choix du modèle : un <details> qui se déplie, à droite du titre. -->
                <details id="choix-langue" class="choix-langue">
                    <summary id="langue-choisie" data-t-attr="aria-label:langue.choisir;title:langue.choisir"></summary>
                    <div class="langues-choix">
                        <button type="button" data-langue="fr"><svg class="drapeau" viewBox="0 0 24 16" aria-hidden="true"><rect width="8" height="16" fill="#002395"/><rect x="8" width="8" height="16" fill="#ffffff"/><rect x="16" width="8" height="16" fill="#ed2939"/></svg><span>Français</span></button>
                        <button type="button" data-langue="en"><svg class="drapeau" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#012169"/><path d="M0 0l24 16M24 0L0 16" stroke="#ffffff" stroke-width="3.2"/><path d="M0 0l24 16M24 0L0 16" stroke="#c8102e" stroke-width="1.8"/><path d="M12 0v16M0 8h24" stroke="#ffffff" stroke-width="5.4"/><path d="M12 0v16M0 8h24" stroke="#c8102e" stroke-width="3.2"/></svg><span>English</span></button>
                        <button type="button" data-langue="es"><svg class="drapeau" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#aa151b"/><rect y="4" width="24" height="8" fill="#f1bf00"/></svg><span>Español</span></button>
                        <button type="button" data-langue="de"><svg class="drapeau" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#000000"/><rect y="5.33" width="24" height="5.34" fill="#dd0000"/><rect y="10.67" width="24" height="5.33" fill="#ffce00"/></svg><span>Deutsch</span></button>
                    </div>
                </details>
                <!-- Tout bouton du menu le ferme (menu.js) : pas de code en plus.
                     autofocus : à l'ouverture, le focus va ici, pas au drapeau. -->
                <button type="button" class="bouton-icone fermer-menu" autofocus data-t-attr="aria-label:menu.fermer;title:menu.fermer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                </button>
            </div>
            <button type="button"
                    class="resume"
                    id="resume-reglages"
                    aria-haspopup="dialog"
                    data-t-attr="title:menu.resume"
                    hidden></button>
            <!-- Masqué sans clé : tout ce qu'il sépare l'est aussi (afficher). -->
            <hr id="trait-outils" hidden>
            <button type="button"
                    class="entree"
                    id="nouvelle"
                    hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                <span data-t="menu.nouvelle"></span>
            </button>
            <!-- Libellés posés par afficherOutil : des noms de modules, non traduits. -->
            <div id="menu-outils"
                 class="outils"
                 role="group"
                 data-t-attr="aria-label:menu.outils"
                 hidden>
                <button type="button" class="entree" data-outil="discuter">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
                    <span></span>
                </button>
                <button type="button" class="entree" data-outil="corriger">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h12M4 12h8M4 17h5"/><path d="M14 19l3 3 5-7"/></svg>
                    <span></span>
                </button>
                <button type="button" class="entree" data-outil="reformuler">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M14 6l4 4"/></svg>
                    <span></span>
                </button>
                <button type="button" class="entree" data-outil="rediger">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                    <span></span>
                </button>
                <!-- Trad masqué : Chat traduit lui-même ("Traduis en anglais : ..."). Le module reste pour l'historique.
                <button type="button" class="entree" data-outil="traduire">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 3-3 7-6 8"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg>
                    <span></span>
                </button>
                -->
            </div>
            <!-- Documents et historique à part, entre deux traits ; masqué sans clé comme eux (afficher). -->
            <hr id="trait-documents" hidden>
            <!-- Projets : en créer un, en rouvrir un, le supprimer, comme l'historique (projet.js, historique.js). -->
            <details id="menu-projets" class="historique" open hidden>
                <summary class="entree">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
                    <span data-t="menu.projets"></span>
                </summary>
                <button type="button" id="nouveau-projet" class="titre-conversation nouveau-projet" data-t="projets.nouveau"></button>
                <ol id="liste-projets" class="liste-historique"></ol>
            </details>
            <details id="menu-historique" class="historique" hidden>
                <summary class="entree">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>
                    <span data-t="menu.historique"></span>
                </summary>
                <input type="search" id="recherche-historique" class="recherche-historique" data-t-attr="placeholder:historique.rechercher;aria-label:historique.rechercher">
                <ol id="liste-historique" class="liste-historique"></ol>
                <p id="historique-vide" class="note"></p>
            </details>
            <hr>
            <button type="button"
                    class="entree"
                    id="ouvrir-reglages"
                    hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
                <span data-t="menu.reglages"></span>
            </button>
            <button type="button" class="entree" id="theme"></button>
            <button type="button" class="entree" id="ouvrir-partage">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                <span data-t="menu.partager"></span>
            </button>
            <button type="button" class="entree" id="ouvrir-info">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>
                <span data-t="menu.apropos"></span>
            </button>
            <button type="button"
                    class="entree danger"
                    id="changer-cle"
                    hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                <span data-t="menu.changer-cle"></span>
            </button>
        </div>
    </dialog>

    <main id="principal">
        <section id="accueil" class="accueil pico" hidden>
            <h2 data-t="cle.titre"></h2>
            <p data-t="cle.intro"></p>
            <!-- Deux étapes : obtenir une clé, la saisir dans une boîte ; acceptée, le chat s'ouvre. -->
            <ol class="etapes">
                <li>
                    <span data-t="cle.etape-acces"></span>
                    <a class="bouton-principal"
                       href="https://albert.playground.etalab.gouv.fr/"
                       target="_blank"
                       rel="noopener noreferrer"
                       data-t="cle.demander"></a>
                </li>
                <li>
                    <span data-t="cle.etape-saisie"></span>
                    <button type="button" id="ouvrir-cle" class="bouton-principal" data-t="cle.saisir"></button>
                </li>
            </ol>
        </section>

        <section id="chat"
                 class="chat"
                 hidden
                 data-t-attr="aria-label:chat.aria">
            <!-- Projet : documents épinglés, envoyés avec chaque question (projet.js). -->
            <details id="documents" class="documents" open>
                <summary id="resume-documents"></summary>
                <label for="nom-projet" class="visuellement-cache" data-t="documents.nom"></label>
                <input type="text" id="nom-projet" class="nom-projet" maxlength="40" data-t-attr="placeholder:documents.nom">
                <ul id="liste-documents" class="liste-documents"></ul>
                <button type="button" id="deposer-documents" class="deposer" data-t="documents.deposer"></button>
                <p class="formats-sources" data-t="documents.formats"></p>
            </details>
            <!-- Projet vide : une phrase et trois demandes types, masquées dès la première question (CSS). -->
            <div class="accueil-projet">
                <p data-t="projet.bienvenue"></p>
                <div class="suggestions">
                    <button type="button" class="suggestion" data-exemple="projet.exemple-evaluation" data-t="projet.evaluation"></button>
                    <button type="button" class="suggestion" data-exemple="projet.exemple-revision" data-t="projet.revision"></button>
                    <button type="button" class="suggestion" data-exemple="projet.exemple-flash" data-t="projet.flash"></button>
                    <button type="button" class="suggestion" data-exemple="projet.exemple-courrier" data-t="projet.courrier"></button>
                </div>
            </div>
            <!-- Chat vide : bienvenue et suggestions, masquées dès la première question (CSS). -->
            <div class="bienvenue">
                <p data-t="bienvenue.texte"></p>
                <div class="suggestions">
                    <button type="button" class="suggestion" data-module="corriger" data-exemple="bienvenue.exemple-corriger" data-t="bienvenue.corriger"></button>
                    <button type="button" class="suggestion" data-module="reformuler" data-exemple="bienvenue.exemple-reformuler" data-t="bienvenue.reformuler"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-traduire" data-t="bienvenue.traduire"></button>
                    <button type="button" class="suggestion" data-module="rediger" data-exemple="bienvenue.exemple-rediger" data-t="bienvenue.rediger"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-calcul" data-t="bienvenue.calcul"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-schema" data-t="bienvenue.schema"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-graphique" data-t="bienvenue.graphique"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-figure" data-t="bienvenue.figure"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-formule" data-t="bienvenue.formule"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-tirage" data-t="bienvenue.tirage"></button>
                    <button type="button" class="suggestion" data-exemple="bienvenue.exemple-recherche" data-t="bienvenue.recherche" data-recherche></button>
                </div>
            </div>
            <ol id="fil"
                class="fil"
                role="log"
                aria-live="polite"></ol>
        </section>

        <!-- Rédiger : proposition en haut, notes en bas (redaction.js). -->
        <section id="redaction" class="redaction" hidden>
            <div class="proposition">
                <p id="etat-redaction" class="etat" role="status"></p>
                <div id="proposition" class="texte-proposition"></div>
                <ul id="anomalies" class="anomalies" data-t-attr="aria-label:anomalies.titre" hidden></ul>
                <div id="actions-redaction" class="actions-reponse"></div>
            </div>
            <label for="notes" class="visuellement-cache" data-t="notes.label"></label>
            <textarea id="notes" class="notes" data-t-attr="placeholder:invite.rediger"></textarea>
        </section>
    </main>

    <footer id="saisie-zone" class="saisie-zone" hidden>
        <form id="form-question" class="saisie">
            <label for="saisie" class="visuellement-cache" data-t="saisie.label"></label>
            <div id="piece-jointe" class="piece-jointe" hidden>
                <span id="piece-nom"></span>
                <button type="button" id="piece-retirer" data-t-attr="aria-label:piece.retirer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <textarea id="saisie" rows="1" aria-describedby="aide-saisie"></textarea>
            <div class="barre">
                <input type="file"
                       id="fichier"
                       accept="image/*,audio/*,.m4a,.opus,.pdf,.docx,.odt,.txt,.md,.csv,.tsv,.json,.xml,.html,.css,.js,.py,.tex,.sql"
                       hidden>
                <button type="button"
                        class="bouton-icone joindre"
                        id="joindre"
                        data-t-attr="aria-label:saisie.joindre;title:saisie.joindre">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>
                </button>
                <!-- Globe : même réglage que l'interrupteur de la recherche (reglages.js). -->
                <button type="button"
                        class="bouton-icone recherche-web"
                        id="recherche-web"
                        aria-pressed="false"
                        data-t-attr="aria-label:saisie.recherche;title:saisie.recherche"></button>
                <button type="button"
                        class="bouton-icone fleche"
                        id="question-precedente"
                        data-t-attr="aria-label:saisie.precedente">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
                </button>
                <button type="button"
                        class="bouton-icone fleche"
                        id="question-suivante"
                        data-t-attr="aria-label:saisie.suivante">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <button type="submit"
                        id="envoyer"
                        class="envoyer"
                        data-t-attr="aria-label:saisie.envoyer">
                    <svg class="icone-envoyer" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    <svg class="icone-arreter" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
                </button>
            </div>
            <!-- Jauge de contexte mise de côté, à revoir (avec affichage.js).
            <div class="jauge" aria-hidden="true"><span id="jauge-niveau"></span></div>
            -->
        </form>
        <p id="etat" class="etat" role="status"></p>
        <p id="aide-saisie" class="avertissement" data-t="saisie.avertissement"></p>
    </footer>

    <div id="toast"
         class="toast"
         role="status"
         aria-live="polite"></div>

    <dialog id="reglages" class="reglages pico" aria-labelledby="titre-reglages">
        <form method="dialog">
            <h2 id="titre-reglages" data-t="reglages.titre"></h2>
            <!-- Quatre cartes dépliables, la première ouverte. -->
            <details class="carte" name="reglages">
                <summary data-t="reglages.carte-reponse"></summary>
                <div class="corps">
                    <fieldset>
                        <legend data-t="reglages.modele"></legend>
                        <details id="choix-modele" class="choix-liste">
                            <summary id="modele-choisi"></summary>
                            <div id="modeles" class="cartes-choix"></div>
                        </details>
                    </fieldset>

                    <fieldset>
                        <legend data-t="reglages.contexte"></legend>
                        <div class="temperature">
                            <input type="range"
                                   id="echanges"
                                   min="0"
                                   max="11"
                                   step="1"
                                   data-t-attr="aria-label:reglages.contexte"
                                   aria-describedby="aide-echanges">
                        </div>
                        <!-- Phrase écrite par afficherReglages : elle porte la valeur du curseur. -->
                        <p id="aide-echanges" class="note"></p>
                    </fieldset>

                    <fieldset>
                        <legend data-t="reglages.temperature"></legend>
                        <div class="temperature">
                            <span aria-hidden="true" data-t="reglages.precis"></span>
                            <input type="range"
                                   id="temperature"
                                   min="0"
                                   max="2"
                                   step="0.1"
                                   aria-describedby="aide-temperature">
                            <span aria-hidden="true" data-t="reglages.creatif"></span>
                            <output id="valeur-temperature" for="temperature"></output>
                        </div>
                        <!-- Phrase écrite par afficherReglages : elle change au-delà de 1. -->
                        <p id="aide-temperature" class="note"></p>
                    </fieldset>

                    <fieldset>
                        <legend data-t="reglages.top-k"></legend>
                        <div class="temperature">
                            <span aria-hidden="true" data-t="reglages.precis"></span>
                            <input type="range"
                                   id="top-k"
                                   min="1"
                                   max="50"
                                   step="1"
                                   data-t-attr="aria-label:reglages.top-k"
                                   aria-describedby="aide-top-k">
                            <span aria-hidden="true" data-t="reglages.creatif"></span>
                        </div>
                        <!-- Phrase écrite par afficherReglages : elle porte la valeur du curseur. -->
                        <p id="aide-top-k" class="note"></p>
                    </fieldset>

                    <!-- Remet les quatre réglages ci-dessus, et eux seuls. -->
                    <button type="button"
                            class="bouton-texte outline"
                            id="reglages-conseilles"
                            data-t="reglages.conseilles"
                            data-t-attr="title:reglages.conseil"></button>
                </div>
            </details>

            <details class="carte" name="reglages">
                <summary data-t="reglages.outils"></summary>
                <div class="corps">
                    <p id="aide-outils" class="note" data-t="reglages.aide-outils"></p>
                    <!-- Un interrupteur par outil local (reglages.js), puis ce qui sort du navigateur. -->
                    <div id="outils-locaux" class="outils-locaux"></div>
                    <fieldset>
                        <legend data-t="reglages.outils-externes"></legend>
                        <div class="outils-locaux">
                            <label class="interrupteur">
                                <input type="checkbox"
                                       id="recherche-reglage"
                                       role="switch"
                                       aria-describedby="aide-outils aide-recherche">
                                <span data-t="reglages.recherche-active"></span>
                            </label>
                        </div>
                        <!-- Une carte par moteur, comme pour les modèles : nom et domaine. -->
                        <details id="choix-moteur" class="choix-liste">
                            <summary id="moteur-choisi"></summary>
                            <div id="moteurs" class="cartes-choix"></div>
                        </details>
                        <p id="aide-recherche" class="note mise-en-garde" data-t="reglages.aide-recherche"></p>
                        <div id="cles-recherche">
                            <label for="cle-recherche" data-t="reglages.cle-recherche"></label>
                            <input type="password"
                                   id="cle-recherche"
                                   autocomplete="off"
                                   spellcheck="false">
                            <label for="cx-recherche" data-t="reglages.cx"></label>
                            <input type="text"
                                   id="cx-recherche"
                                   autocomplete="off"
                                   spellcheck="false">
                        </div>
                    </fieldset>

                    <!-- Tous les outils locaux activés, Internet désactivé, moteur Wikipédia. -->
                    <button type="button"
                            class="bouton-texte outline"
                            id="outils-conseilles"
                            data-t="reglages.conseilles"
                            data-t-attr="title:reglages.conseil-outils"></button>
                </div>
            </details>
            <details class="carte" name="reglages">
                <summary data-t="reglages.carte-application"></summary>
                <div class="corps">
                    <fieldset>
                        <legend data-t="reglages.nom"></legend>
                        <input type="text"
                               id="nom-application"
                               maxlength="12"
                               placeholder="Albert Go"
                               autocomplete="off"
                               spellcheck="false"
                               aria-describedby="aide-nom"
                               data-t-attr="aria-label:reglages.nom">
                        <p id="aide-nom" class="note" data-t="reglages.aide-nom"></p>
                    </fieldset>

                    <fieldset>
                        <legend data-t="cle.label"></legend>
                        <p class="note" data-t="reglages.cle-note"></p>
                        <label class="interrupteur">
                            <input type="checkbox" id="partage-reglage" role="switch">
                            <span id="texte-partage-reglage"></span>
                        </label>
                    </fieldset>

                    <fieldset>
                        <legend data-t="reglages.lecture"></legend>
                        <label class="interrupteur">
                            <input type="checkbox"
                                   id="voix-en-ligne"
                                   role="switch"
                                   aria-describedby="aide-voix">
                            <span data-t="reglages.voix-en-ligne"></span>
                        </label>
                        <p id="aide-voix" class="note mise-en-garde" data-t="reglages.aide-voix"></p>
                    </fieldset>
                </div>
            </details>

            <div class="boutons-dialogue">
                <button type="submit" class="bouton-principal" data-t="dialogue.fermer"></button>
            </div>
        </form>
    </dialog>

    <!-- Saisie de la clé, ouverte depuis l'accueil (cle.js). -->
    <dialog id="dialogue-cle" class="reglages pico" aria-labelledby="titre-cle">
        <form id="form-cle">
            <h2 id="titre-cle" data-t="cle.titre-boite"></h2>
            <label for="cle" class="visuellement-cache" data-t="cle.label"></label>
            <input type="password"
                   id="cle"
                   autocomplete="off"
                   spellcheck="false"
                   required
                   data-t-attr="placeholder:cle.exemple">
            <p id="message-cle" class="message-cle" role="status"></p>
            <label class="interrupteur">
                <input type="checkbox"
                       id="partage-accueil"
                       role="switch">
                <span data-t="cle.souvenir"></span>
            </label>
            <details class="details-cle">
                <summary data-t="cle.ou-va"></summary>
                <div data-t-html="cle.stockee"></div>
            </details>
            <div class="boutons-dialogue">
                <button type="button"
                        id="annuler-cle"
                        class="bouton-texte outline"
                        data-t="dialogue.annuler"></button>
                <button type="submit" class="bouton-principal" data-t="dialogue.ok"></button>
            </div>
        </form>
    </dialog>

    <dialog id="confirmer-cle"
            class="reglages pico"
            aria-labelledby="titre-confirmer-cle"
            aria-describedby="texte-confirmer-cle">
        <form method="dialog">
            <h2 id="titre-confirmer-cle" data-t="confirmer-changer-cle.titre"></h2>
            <p id="texte-confirmer-cle" data-t="confirmer-changer-cle.texte"></p>
            <div class="boutons-dialogue">
                <button type="submit"
                        value="non"
                        class="bouton-texte outline"
                        autofocus
                        data-t="dialogue.non"></button>
                <button type="submit"
                        value="oui"
                        class="bouton-principal"
                        data-t="dialogue.oui"></button>
            </div>
        </form>
    </dialog>

    <dialog id="confirmer-suppression"
            class="reglages pico"
            aria-labelledby="titre-confirmer-suppression"
            aria-describedby="texte-confirmer-suppression">
        <form method="dialog">
            <h2 id="titre-confirmer-suppression" data-t="confirmer-suppression.titre"></h2>
            <p id="texte-confirmer-suppression"></p>
            <div class="boutons-dialogue">
                <button type="submit"
                        value="non"
                        class="bouton-texte outline"
                        autofocus
                        data-t="dialogue.non"></button>
                <button type="submit"
                        value="oui"
                        class="bouton-principal"
                        data-t="dialogue.oui"></button>
            </div>
        </form>
    </dialog>

    <dialog id="partage"
            class="reglages partage pico"
            aria-labelledby="titre-partage"
            aria-describedby="texte-partage">
        <form method="dialog">
            <h2 id="titre-partage" data-t="partage.titre"></h2>
            <div class="carte-texte">
                <p id="texte-partage" data-t="partage.texte"></p>
                <img id="qr-partage"
                     class="qr"
                     width="240"
                     height="240"
                     data-t-attr="alt:partage.qr">
                <div class="adresse-partage">
                    <label for="adresse-partage" class="visuellement-cache" data-t="partage.adresse"></label>
                    <input type="text" id="adresse-partage" readonly>
                    <!-- autofocus : à l'ouverture, le focus va au bouton, pas à l'adresse. -->
                    <button type="button"
                            class="bouton-texte outline"
                            id="copier-adresse"
                            autofocus
                            data-t="partage.copier"></button>
                </div>
            </div>
            <button type="submit" class="bouton-principal" data-t="dialogue.fermer"></button>
        </form>
    </dialog>

    <dialog id="info" class="reglages info" aria-labelledby="titre-info">
        <form method="dialog">
            <h2 id="titre-info" data-t="info.titre"></h2>
            <div class="carte-texte">
                <p data-t-html="info.intro"></p>

                <section>
                    <h3 data-t="info.donnees"></h3>
                    <ul>
                        <li data-t="info.donnees.relais"></li>
                        <li data-t="info.donnees.traceurs"></li>
                    </ul>
                </section>

                <section>
                    <h3 data-t="info.clavier"></h3>
                    <p data-t="info.clavier.texte"></p>
                </section>

                <section>
                    <h3 data-t="info.reponses"></h3>
                    <p data-t="info.reponses.texte"></p>
                </section>

                <section>
                    <h3 data-t="info.projet"></h3>
                    <p data-t-html="info.projet.texte"></p>
                    <p id="appels" hidden></p>
                    <p><span data-t="info.version"></span><span id="version"></span></p>
                </section>
            </div>

            <button type="submit" class="bouton-principal" data-t="dialogue.fermer"></button>
        </form>
    </dialog>
