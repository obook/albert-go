-->

<body>
    <!-- Copie d'une réponse à imprimer en PDF (reponse.js, imprimer), seule visible à l'impression. -->
    <div id="impression"></div>
    <header class="entete">
        <button type="button"
                class="bouton-icone burger"
                id="ouvrir-menu"
                data-t-attr="aria-label:menu.ouvrir"
                aria-haspopup="dialog"
                aria-controls="menu"
                aria-expanded="false">
            <svg class="icone-burger" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <svg class="icone-volet" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            <!-- Retiré le 21/11/2026 : flèche du menu ouvert, retour à l'icône du volet.
            <svg class="icone-replier" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            -->
        </button>
        <div class="titre">
            <!-- Le nom de l'outil actif suit la marque : afficherOutil le remplit. -->
            <h1 class="marque">Albert&nbsp;Go<span class="outil-actif" id="outil-actif"></span></h1>
        </div>
        <!-- Grand écran : la conversation ouverte (historique.js, afficherCourante). -->
        <p class="titre-entete" id="titre-entete"></p>
        <!-- Imprimerie : ouvre la bibliothèque, volet de droite (projet.js). -->
        <button type="button"
                class="bouton-icone"
                id="ouvrir-bibliotheque"
                data-t-attr="aria-label:bibliotheque.ouvrir;title:bibliotheque.ouvrir"
                aria-haspopup="dialog"
                aria-controls="bibliotheque"
                aria-expanded="false"
                hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 5l4 15M3 20h18"/></svg>
        </button>
    </header>

    <!-- Traduire : langues dans une carte fixe sous l'en-tête. -->
    <div id="langues" class="barre-langues" hidden>
        <div class="langues pico">
            <select id="langue-source" data-t-attr="aria-label:langue.source"></select>
            <svg class="fleche-langues" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <select id="langue-cible" data-t-attr="aria-label:langue.cible"></select>
        </div>
    </div>

    <div data-page="menu/volet"></div>

    <div data-page="bibliotheque/volet"></div>

    <div data-page="bibliotheque/aide"></div>

    <div data-page="bibliotheque/coller"></div>

    <div data-page="bibliotheque/guide"></div>

    <main id="principal">
        <div data-page="conversation/accueil"></div>

        <div data-page="conversation/chat"></div>

        <div data-page="conversation/redaction"></div>
    </main>

    <div data-page="conversation/saisie"></div>

    <div id="toast"
         class="toast"
         popover="manual"
         role="status"
         aria-live="polite"></div>

    <div data-page="reglages/boite"></div>

    <div data-page="cle/saisie"></div>

    <div data-page="cle/bienvenue"></div>

    <div data-page="cle/confirmer"></div>

    <div data-page="menu/a-propos"></div>

    <!-- Place le HTML de pages/ dans les emplacements data-page, puis charge les scripts de l'interface. -->
    <script src="js/socle/chargement.js?v=dev"></script>
