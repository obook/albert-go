name: pages

# La version en ligne : https://obook.github.io/albert-go/
# Sans serveur.js, la page passe par le relais n8n avec la clé de l'utilisateur (albert.js).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Préparer public/
        run: |
          SHORT="${GITHUB_SHA::7}"
          DATE="$(git log -1 --format=%cI)"
          # Version affichée dans "À propos" : commit publié et sa date.
          echo "const VERSION = { commit: '${SHORT}', date: '${DATE}' };" > public/js/socle/version.js
          # Adresses des feuilles et scripts propres à chaque version : pas de mélange en cache.
          sed -i "s/?v=dev/?v=${SHORT}/g" public/index.html
          cp deploiement/pages/sw.js public/
          # serveur.js vide : SERVEUR reste indéfini, sans 404 dans la console.
          echo "// Version en ligne, pas de serveur Albert Go." > public/serveur.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
