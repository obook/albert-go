# À chaque MR : tests unitaires, puis Albert Go dans WebKit, le moteur de l'iPad.
tests:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  script:
    - node --test tests/*.test.js
    - npm i --no-save --no-audit --no-fund playwright@1.63.0
    - node --test tests/ipad.webkit.js
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# À chaque MR : tests du serveur Python.
tests-serveur:
  image: python:3.12-slim
  script:
    - pip install -q -r serveur/requirements.txt pytest
    - python -m pytest -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
