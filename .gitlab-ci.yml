# À chaque MR : tests unitaires, puis Albert Go dans WebKit, le moteur de l'iPad.
tests:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  script:
    - node --test tests/*.test.js tests/albert/*.test.js
    - npm i --no-save --no-audit --no-fund playwright@1.63.0
    - node --test tests/ipad.webkit.js
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# À chaque MR : tests du serveur Python.
tests-serveur:
  image: python:3.12-slim
  script:
    - pip install -q -r serveur/requirements.txt pytest
    - python -m pytest -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Sur un tag vX.Y.Z : Albert Go pour clé USB (Electron, Python embarqué), puis la release.
variables:
  PAQUETS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/albert-go/${CI_COMMIT_TAG}"

paquet-linux:
  stage: build
  image: node:22-bookworm-slim
  variables:
    # appimagetool s'extrait sans FUSE.
    APPIMAGE_EXTRACT_AND_RUN: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    # En MR qui touche au paquet : fabriqué, pas déposé.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [standalone/**/*, serveur/requirements.txt, .gitlab-ci.yml]
  script:
    - apt-get update -qq && apt-get install -y -qq curl git zip
    - cd standalone
    - curl -fsSL "https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz" | tar -xz
    - mv python python-linux
    - python-linux/bin/python3 -m pip install -q -r ../serveur/requirements.txt
    - npm ci
    - if [ -n "$CI_COMMIT_TAG" ]; then npm pkg set version="${CI_COMMIT_TAG#v}"; fi
    - npm run build -- --linux AppImage
    # Comme l'archive Windows : l'AppImage, la notice et le modèle de .env.
    - mkdir archive && cp dist/*.AppImage ../docs/documentation.pdf ../.env-exemple archive/
    - (cd archive && zip -qr "../Albert-Go-${CI_COMMIT_TAG}-linux.zip" .)
    - 'if [ -n "$CI_COMMIT_TAG" ]; then curl -fsS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "Albert-Go-${CI_COMMIT_TAG}-linux.zip" "${PAQUETS}/Albert-Go-${CI_COMMIT_TAG}-linux.zip"; fi'

paquet-windows:
  stage: build
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    # En MR qui touche au paquet : fabriqué, pas déposé.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [standalone/**/*, serveur/requirements.txt, .gitlab-ci.yml]
  script:
    - apt-get update -qq && apt-get install -y -qq curl git zip unzip python3-pip poppler-utils
    # La notice, livrée dans l'archive, doit annoncer la version du tag.
    - 'if [ -n "$CI_COMMIT_TAG" ] && ! pdftotext -l 1 docs/documentation.pdf - | grep -qx "Version ${CI_COMMIT_TAG}"; then echo "docs/documentation.pdf n''annonce pas ${CI_COMMIT_TAG} : changer \\version, recompiler, commiter."; exit 1; fi'
    - cd standalone
    - curl -fsSLo python-win.zip https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip
    - unzip -q python-win.zip -d python-win && rm python-win.zip
    # Chemins de Python : ses paquets et le serveur dans resources\albert-go.
    - printf 'python312.zip\n.\nLib\\site-packages\n..\\albert-go\nimport site\n' > python-win/python312._pth
    - 'python3 -m pip install -q --platform win_amd64 --python-version 3.12 --only-binary=:all: --target python-win/Lib/site-packages -r ../serveur/requirements.txt'
    - npm ci
    - if [ -n "$CI_COMMIT_TAG" ]; then npm pkg set version="${CI_COMMIT_TAG#v}"; fi
    # dir et non portable : pas besoin de Wine.
    - npm run build -- --win dir
    - (cd dist/win-unpacked && zip -qr "../../Albert-Go-${CI_COMMIT_TAG}-win64.zip" .)
    - 'if [ -n "$CI_COMMIT_TAG" ]; then curl -fsS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "Albert-Go-${CI_COMMIT_TAG}-win64.zip" "${PAQUETS}/Albert-Go-${CI_COMMIT_TAG}-win64.zip"; fi'
    - 'if [ -n "$CI_COMMIT_TAG" ]; then curl -fsS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ../docs/documentation.pdf "${PAQUETS}/Albert-Go-${CI_COMMIT_TAG}-documentation.pdf"; fi'

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Albert Go $CI_COMMIT_TAG
    description: |
      Version autonome d'Albert Go : le serveur et Python sont embarqués, rien à installer.

      - Linux : décompresser l'archive, puis lancer l'AppImage.
      - Windows : décompresser l'archive, puis lancer Albert-Go.exe.

      La configuration est le fichier .env à côté de l'application, créé au premier lancement s'il manque : y coller la clé API ou y activer le kiosque (ALBERT_KIOSQUE=oui). Chaque archive contient aussi la notice (documentation.pdf) et le modèle .env-exemple.
    assets:
      links:
        - name: Albert Go Linux x64 (archive)
          url: ${PAQUETS}/Albert-Go-${CI_COMMIT_TAG}-linux.zip
          link_type: package
        - name: Albert Go Windows x64 (archive)
          url: ${PAQUETS}/Albert-Go-${CI_COMMIT_TAG}-win64.zip
          link_type: package
        - name: Notice (PDF)
          url: ${PAQUETS}/Albert-Go-${CI_COMMIT_TAG}-documentation.pdf
          link_type: other

# Pages : la version en ligne, https://booklageolivier.forge.apps.education.fr/albert-go/
# Sans serveur.js, la page passe par le relais n8n avec la clé de l'utilisateur (albert.js).
pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Version affichée dans "À propos" : commit publié et sa date.
    # Bloc littéral : sans lui, YAML lit "commit: ..." comme une clé.
    - |
      echo "const VERSION = { commit: '${CI_COMMIT_SHORT_SHA}', date: '${CI_COMMIT_TIMESTAMP}' };" > public/js/socle/version.js
    # Adresses des feuilles et scripts propres à chaque version : pas de mélange en cache.
    - sed -i "s/?v=dev/?v=${CI_COMMIT_SHORT_SHA}/g" public/index.html
    - cp deploiement/pages/sw.js public/
    # serveur.js vide : SERVEUR reste indéfini, sans 404 dans la console.
    - echo "// Version en ligne, pas de serveur Albert Go." > public/serveur.js
  artifacts:
    paths:
      - public
