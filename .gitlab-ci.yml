# Publie public/ sur Pages : https://booklageolivier.forge.apps.education.fr/albert-go/
pages:
  image: alpine:latest
  script:
    # Version affichée dans "À propos" : commit publié et sa date.
    # Bloc littéral : sans lui, YAML lit "commit: ..." comme une clé.
    - |
      echo "const VERSION = { commit: '${CI_COMMIT_SHORT_SHA}', date: '${CI_COMMIT_TIMESTAMP}' };" > public/js/version.js
    - echo "Publication de public/"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
